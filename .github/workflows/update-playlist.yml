name: 📺 Daily Playlist Update

on:
  schedule:
    # 3:00 AM IST daily (9:30 PM UTC previous day)
    - cron: '30 21 * * *'
  workflow_dispatch:

# Prevent concurrent runs that could corrupt files
concurrency:
  group: iptv-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install FFmpeg (for ffprobe)
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      # ─── Download Sources ──────────────────────────────────────

      - name: 📡 Download playlist sources
        id: download
        run: |
          SOURCES_OK=true

          # ── Source 1: iptv-org India ──
          echo "🔍 Downloading iptv-org/iptv India streams..."
          if curl -L -o /tmp/source_iptv_org.m3u \
               --connect-timeout 30 --max-time 120 --retry 3 --retry-delay 5 \
               "https://raw.githubusercontent.com/iptv-org/iptv/refs/heads/master/streams/in.m3u"; then
            COUNT=$(grep -c "^#EXTINF" /tmp/source_iptv_org.m3u 2>/dev/null || echo 0)
            echo "  iptv-org: ${COUNT} channels"
            if [ "$COUNT" -lt 50 ]; then
              echo "  ⚠️  Too few channels — skipping iptv-org source"
              rm -f /tmp/source_iptv_org.m3u
            fi
          else
            echo "  ❌ iptv-org download failed"
            rm -f /tmp/source_iptv_org.m3u
          fi

          # ── Source 2: Add additional sources here ──
          # Example:
          # curl -L -o /tmp/source_custom.m3u --connect-timeout 30 --max-time 120 \
          #   "https://example.com/india.m3u"

          # Check that at least one source downloaded successfully
          SOURCE_FILES=(/tmp/source_*.m3u)
          if [ ${#SOURCE_FILES[@]} -eq 0 ] || [ ! -f "${SOURCE_FILES[0]}" ]; then
            echo "❌ No playlist sources available — aborting"
            echo "SOURCES_OK=false" >> $GITHUB_ENV
          else
            TOTAL_SOURCE=$(cat /tmp/source_*.m3u 2>/dev/null | grep -c "^#EXTINF" || echo 0)
            echo "✅ Total source channels: ${TOTAL_SOURCE}"
            echo "SOURCES_OK=true" >> $GITHUB_ENV
          fi

      # ─── Merge + Verify ───────────────────────────────────────

      - name: 🔀 Merge sources with base playlist
        if: env.SOURCES_OK == 'true'
        run: |
          # Snapshot the pre-merge state for change detection
          cp latest.m3u /tmp/old_latest.m3u
          if [ -d streams ]; then
            rm -rf /tmp/old_streams
            cp -R streams /tmp/old_streams
          fi
          OLD_COUNT=$(grep -c "^#EXTINF" /tmp/old_latest.m3u || echo 0)
          echo "OLD_COUNT=${OLD_COUNT}" >> $GITHUB_ENV

          # Merge: base.m3u + each source file → /tmp/merged.m3u
          # Start from the permanent base (sources/base.m3u)
          MERGE_ARGS="sources/base.m3u"
          for f in /tmp/source_*.m3u; do
            [ -f "$f" ] && MERGE_ARGS="$MERGE_ARGS $f"
          done
          echo "Merging with args: $MERGE_ARGS"
          python3 scripts/merge_playlists.py $MERGE_ARGS /tmp/merged.m3u

          # Stage merged result as the working latest.m3u for verification scripts
          cp /tmp/merged.m3u latest.m3u

      - name: 🔬 Stream health verification (ffprobe)
        if: env.SOURCES_OK == 'true'
        run: python3 scripts/check_streams.py

      - name: 🔄 HLS loop detection
        if: env.SOURCES_OK == 'true'
        run: python3 scripts/detect_loops.py

      - name: 📋 Upload verification reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports-${{ github.run_number }}
          path: |
            stream_report.json
            loop_report.json
          retention-days: 7

      - name: 🎨 Standardize M3U (VLC options, timeshift)
        if: env.SOURCES_OK == 'true'
        run: python3 scripts/standardize_m3u.py

      - name: 🗂️ Normalize categories
        if: env.SOURCES_OK == 'true'
        run: python3 scripts/reorganize_categories.py

      - name: ✂️ Filter failing streams
        if: env.SOURCES_OK == 'true'
        run: python3 scripts/filter_playlist.py

      - name: 🧭 Build stable stream wrapper files
        if: env.SOURCES_OK == 'true'
        run: python3 scripts/build_stream_wrappers.py latest.m3u --output-dir streams --public-base-url "https://shahakshay938.github.io/streams"

      # ─── Detect Changes ───────────────────────────────────────

      - name: 🔍 Detect changes and compute stats
        if: env.SOURCES_OK == 'true'
        run: |
          NEW_COUNT=$(grep -c "^#EXTINF" latest.m3u || echo 0)
          OLD_COUNT="${OLD_COUNT:-0}"
          DIFF=$((NEW_COUNT - OLD_COUNT))

          echo "NEW_COUNT=${NEW_COUNT}" >> $GITHUB_ENV
          echo "CHANNEL_DIFF=${DIFF}" >> $GITHUB_ENV

          if git diff --quiet -- latest.m3u streams/; then
            echo "✅ No playlist changes detected"
            echo "HAS_CHANGES=false" >> $GITHUB_ENV

            # Restore original state to avoid unnecessary git diff
            cp /tmp/old_latest.m3u latest.m3u
            rm -rf streams
            if [ -d /tmp/old_streams ]; then
              cp -R /tmp/old_streams streams
            fi
          else
            echo "🚀 Playlist changed (${OLD_COUNT} → ${NEW_COUNT} channels, diff: ${DIFF:+}${DIFF})"
            echo "HAS_CHANGES=true" >> $GITHUB_ENV
          fi

      # ─── Backup & Commit ──────────────────────────────────────

      - name: 📁 Archive previous playlist and prune old backups
        if: env.HAS_CHANGES == 'true'
        run: |
          mkdir -p backups
          mkdir -p backups/streams
          DATE=$(date +%F)

          # Archive yesterday's stable playlist plus its wrapper snapshot
          python3 scripts/export_stream_backup.py \
            --input-playlist /tmp/old_latest.m3u \
            --source-streams-dir /tmp/old_streams \
            --output-playlist "backups/playlist-${DATE}.m3u" \
            --output-streams-dir "backups/streams/${DATE}" \
            --public-base-url "https://shahakshay938.github.io/backups/streams/${DATE}"
          echo "📦 Archived to backups/playlist-${DATE}.m3u"

          # Retention: keep last 14 days of playlist backups
          # Never delete sources/base.m3u or the original 2026-03-19 backup
          PROTECTED="playlist-2026-03-19.m3u"
          ls backups/playlist-*.m3u 2>/dev/null | grep -v "$PROTECTED" | sort | head -n -14 | while read f; do
            echo "🗑️  Removing old backup: $f"
            OLD_DATE=$(basename "$f" .m3u | sed 's/^playlist-//')
            rm -f "$f"
            rm -rf "backups/streams/${OLD_DATE}"
          done

      - name: 📝 Update README stats
        if: env.HAS_CHANGES == 'true'
        run: |
          DATE=$(date +%F)
          sed -i "s|backups/playlist-[0-9-]*.m3u|backups/playlist-${DATE}.m3u|g" README.md
          sed -i "s/Total Verified Channels (Current):\*\* [0-9]*/Total Verified Channels (Current):** ${NEW_COUNT}/g" README.md

      - name: 📤 Commit and push playlist changes
        if: env.HAS_CHANGES == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          # Ensure runtime artifacts stay untracked
          git rm --cached stream_report.json loop_report.json astra_audit_report.json 2>/dev/null || true

          git add latest.m3u streams/ backups/ README.md

          if git diff --cached --quiet; then
            echo "ℹ️  Nothing to commit"
          else
            DATE=$(date -u +"%Y-%m-%d")
            DIFF_LABEL=""
            if [ "${CHANNEL_DIFF}" -gt 0 ]; then
              DIFF_LABEL=" (+${CHANNEL_DIFF} new)"
            elif [ "${CHANNEL_DIFF}" -lt 0 ]; then
              DIFF_LABEL=" (${CHANNEL_DIFF} removed)"
            fi

            git commit -m "$(printf '📺 Playlist update: %s channels%s [%s]\n\n- Previous: %s channels\n- Current:  %s channels\n- Sources: iptv-org/iptv India + curated base' "${NEW_COUNT}" "${DIFF_LABEL}" "${DATE}" "${OLD_COUNT}" "${NEW_COUNT}")"
            git push
            echo "✅ Playlist pushed"

            echo "## ✅ Playlist Updated" >> $GITHUB_STEP_SUMMARY
            echo "- **Channels:** ${OLD_COUNT} → ${NEW_COUNT} (${DIFF_LABEL})" >> $GITHUB_STEP_SUMMARY
            echo "- **Backup:** backups/playlist-$(date +%F).m3u" >> $GITHUB_STEP_SUMMARY
            echo "- **Stable wrappers:** streams/*.m3u8" >> $GITHUB_STEP_SUMMARY
          fi

      - name: ℹ️  No changes summary
        if: env.HAS_CHANGES == 'false' || env.SOURCES_OK == 'false'
        run: |
          if [ "${SOURCES_OK}" = "false" ]; then
            echo "## ❌ Sources Unavailable" >> $GITHUB_STEP_SUMMARY
            echo "All playlist sources failed to download. Existing latest.m3u unchanged." >> $GITHUB_STEP_SUMMARY
          else
            echo "## ℹ️  No Changes" >> $GITHUB_STEP_SUMMARY
            echo "Playlist verified — no stream changes today. No commit needed." >> $GITHUB_STEP_SUMMARY
          fi
