name: 📺 Daily IPTV Playlist & EPG Update

on:
  schedule:
    # Run daily at 3:00 AM IST (9:30 PM UTC previous day)
    - cron: '30 21 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ─── Update Playlist ───────────────────────────────
      - name: 📡 Download latest streams from iptv-org
        run: |
          curl -L -o /tmp/iptv_org_in.m3u \
            --connect-timeout 30 --max-time 120 --retry 3 \
            "https://raw.githubusercontent.com/iptv-org/iptv/refs/heads/master/streams/in.m3u"

          CHANNELS=$(grep -c "^#EXTINF" /tmp/iptv_org_in.m3u || echo 0)
          echo "✅ Downloaded ${CHANNELS} channels from iptv-org"

          if [ "$CHANNELS" -lt 50 ]; then
            echo "❌ Too few channels, source may be broken. Skipping playlist update."
            echo "PLAYLIST_OK=false" >> $GITHUB_ENV
          else
            echo "PLAYLIST_OK=true" >> $GITHUB_ENV
          fi

      - name: 🕵️ Verify & Filter New Streams
        run: |
          # Copy latest to tmp to work on it without overwriting yet
          cp latest.m3u /tmp/base_for_merge.m3u
          
          python3 scripts/merge_playlists.py \
            backups/playlist-base-v1.m3u \
            /tmp/iptv_org_in.m3u \
            /tmp/new_latest.m3u
            
          # Run verification on the NEW candidate
          # Note: We need to modify the scripts to accept input/output paths 
          # Or temporarily swap files. For now, let's use the local file swap method.
          cp latest.m3u latest.m3u.bak
          cp /tmp/new_latest.m3u latest.m3u
          
          python3 scripts/check_streams.py
          python3 scripts/detect_loops.py
          
          # APPLY PREMIUM STANDARDS (Timeshift, Reconnect, AR)
          python3 scripts/standardize_m3u.py
          
          # CLEAN CATEGORIES (Single genre, no clubs)
          python3 scripts/reorganize_categories.py
          
          python3 scripts/filter_playlist.py
          
          # Now 'latest.m3u' contains the NEW filtered result.
          # We compare it with the backup of the OLD state.
          if diff -q latest.m3u latest.m3u.bak > /dev/null; then
             echo "✅ No stream changes detected. Skipping backup and push."
             echo "HAS_CHANGES=false" >> $GITHUB_ENV
             mv latest.m3u.bak latest.m3u
          else
             echo "🚀 Changes detected! Proceeding with backup and update."
             echo "HAS_CHANGES=true" >> $GITHUB_ENV
             # Keep the new latest.m3u, but keep the old one for the backup step
             mv latest.m3u.bak /tmp/old_stable.m3u
          fi
          
          VERIFIED=$(grep -c "^#EXTINF" latest.m3u || echo 0)
          echo "VERIFIED_CHANNELS=${VERIFIED}" >> $GITHUB_ENV

      # ─── Update EPG (Multi-Source with Fallback) ───────
      - name: 📋 Download EPG sources
        run: |
          EPG_UPDATED=false
          EPG_SOURCE=""

          # ── Source 1: JioTV EPG (Primary - most accurate schedule) ──
          echo "🔍 Trying Source 1: mitthu786/tvepg (JioTV)..."
          curl -L -o /tmp/epg_jiotv.xml.gz \
            --connect-timeout 30 --max-time 180 --retry 2 \
            "https://raw.githubusercontent.com/mitthu786/tvepg/main/jiotv/epg.xml.gz" 2>/dev/null || true

          if file /tmp/epg_jiotv.xml.gz 2>/dev/null | grep -q "gzip"; then
            SIZE=$(stat -c%s /tmp/epg_jiotv.xml.gz)
            if [ "$SIZE" -gt 100000 ]; then
              echo "✅ JioTV EPG downloaded ($(du -h /tmp/epg_jiotv.xml.gz | cut -f1))"
              echo "JIOTV_EPG_OK=true" >> $GITHUB_ENV
            else
              echo "❌ JioTV EPG too small"
              echo "JIOTV_EPG_OK=false" >> $GITHUB_ENV
            fi
          else
            echo "❌ JioTV EPG download failed or not valid gzip"
            echo "JIOTV_EPG_OK=false" >> $GITHUB_ENV
          fi

          # ── Source 2: epg.pw (Fallback - IDs match playlist natively) ──
          echo "🔍 Trying Source 2: epg.pw..."
          curl -L -o /tmp/epg_epgpw.xml.gz \
            --connect-timeout 30 --max-time 180 --retry 2 \
            -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36" \
            "https://epg.pw/xmltv/epg_IN.xml.gz" 2>/dev/null || true

          if file /tmp/epg_epgpw.xml.gz 2>/dev/null | grep -q "gzip"; then
            SIZE=$(stat -c%s /tmp/epg_epgpw.xml.gz)
            if [ "$SIZE" -gt 100000 ]; then
              echo "✅ epg.pw EPG downloaded ($(du -h /tmp/epg_epgpw.xml.gz | cut -f1))"
              echo "EPGPW_OK=true" >> $GITHUB_ENV
            else
              echo "❌ epg.pw EPG too small"
              echo "EPGPW_OK=false" >> $GITHUB_ENV
            fi
          else
            echo "❌ epg.pw download failed or not valid gzip"
            echo "EPGPW_OK=false" >> $GITHUB_ENV
          fi

      # ── Map JioTV EPG to our playlist format ──
      - name: 🔗 Map JioTV EPG channels
        if: env.JIOTV_EPG_OK == 'true'
        run: |
          python3 scripts/build_epg_mapping.py \
            latest.m3u \
            /tmp/epg_jiotv.xml.gz \
            epg.xml.gz \
            channel_mapping.json

          echo "EPG_SOURCE=JioTV (mapped)" >> $GITHUB_ENV
          echo "EPG_UPDATED=true" >> $GITHUB_ENV

      # ── Fallback to epg.pw if JioTV mapping failed ──
      - name: 📋 Fallback to epg.pw EPG
        if: env.JIOTV_EPG_OK != 'true' && env.EPGPW_OK == 'true'
        run: |
          cp /tmp/epg_epgpw.xml.gz epg.xml.gz
          echo "✅ Using epg.pw EPG as fallback"
          echo "EPG_SOURCE=epg.pw" >> $GITHUB_ENV
          echo "EPG_UPDATED=true" >> $GITHUB_ENV

      - name: ⚠️ EPG update status
        if: env.JIOTV_EPG_OK != 'true' && env.EPGPW_OK != 'true'
        run: |
          echo "⚠️ All EPG sources failed, keeping existing file"
          git checkout epg.xml.gz 2>/dev/null || true
          echo "EPG_UPDATED=false" >> $GITHUB_ENV
          echo "EPG_SOURCE=none (kept existing)" >> $GITHUB_ENV

      # ─── Backup & README Update ──────────────────────────
      - name: 📁 Archive Old Stable & Update README
        if: env.HAS_CHANGES == 'true'
        run: |
          mkdir -p backups
          DATE=$(date +%F)
          # Move OLD stable to backup folder
          cp /tmp/old_stable.m3u "backups/playlist-${DATE}.m3u"
          
          # Update README with the NEW backup date
          sed -i "s/backups\/playlist-.*\.m3u/backups\/playlist-${DATE}\.m3u/g" README.md
          # Update Verified Channel Count in README
          sed -i "s/Total Verified Channels (Current):\*\* [0-9]*/Total Verified Channels (Current):\*\* ${VERIFIED_CHANNELS}/g" README.md
          
          if [ -f epg.xml.gz ]; then
            cp epg.xml.gz "backups/epg-${DATE}.xml.gz"
          fi

      # ─── Commit & Push ───────────
      - name: 📤 Commit and push changes
        if: env.HAS_CHANGES == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          git add latest.m3u epg.xml.gz channel_mapping.json backups/ README.md

          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit"
            echo "## ℹ️ No Changes" >> $GITHUB_STEP_SUMMARY
            echo "No updates were needed today." >> $GITHUB_STEP_SUMMARY
          else
            DATE=$(date -u +"%Y-%m-%d")
            TOTAL="${TOTAL_CHANNELS:-$(grep -c '^#EXTINF' latest.m3u || echo '?')}"
            UPDATED="${UPDATED_URLS:-0}"
            NEW="${NEW_CHANNELS:-0}"
            EPG_SIZE=$(du -h epg.xml.gz | cut -f1)

            # Build commit title
            TITLE="📺 Daily update: ${TOTAL} channels"
            if [ "${EPG_UPDATED}" = "true" ]; then
              TITLE="${TITLE}, EPG ${EPG_SIZE} via ${EPG_SOURCE}"
            fi
            TITLE="${TITLE} [${DATE}]"

            # Build commit body with details
            BODY=""
            if [ "$NEW" -gt 0 ] && [ -n "${NEW_CHANNEL_NAMES}" ]; then
              BODY="${BODY}🆕 New channels (${NEW}): ${NEW_CHANNEL_NAMES}\n"
            fi
            if [ "$UPDATED" -gt 0 ] && [ -n "${MODIFIED_CHANNEL_NAMES}" ]; then
              BODY="${BODY}🔄 Updated URLs (${UPDATED}): ${MODIFIED_CHANNEL_NAMES}\n"
            fi
            BODY="${BODY}📋 EPG Source: ${EPG_SOURCE:-unknown} (${EPG_SIZE})\n"

            echo -e "${BODY}" | git commit -F <(echo "${TITLE}" && echo "" && echo -e "${BODY}")
            git push
            echo "✅ Changes pushed successfully!"

            # Final summary
            echo "## ✅ Changes Pushed" >> $GITHUB_STEP_SUMMARY
            echo "- **Commit:** ${TITLE}" >> $GITHUB_STEP_SUMMARY
          fi
